<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bottom up</title>
  <link rel="stylesheet" href="bottom_up.css">
</head>
<body>
    <div class="pagelayout">
  <div class="playerinteractivespace">
    <!-- Resource Container -->
    <div class="resourcecontainer">
        <h1>Resources</h1>
        <p> work hours: <span id="text_workhours">0</span></p>
        <p>Barn space: <span id="text_storage_current">0</span> / <span id="text_storage">0</span></p>
        <p>housing available: <span id="text_peoplecap_current">0</span> / <span id="text_peoplecap">0</span> </p>

      <div class="resourcescolumns">
        
        <p>Human: <span id="text_human">0</span></p>
        <p>timbermellow: <span id="text_timbermellow">0</span></p>
        <p>Soldier: <span id="text_soldier">0</span></p>
        <p>wood: <span id="text_wood">0</span></p>
        <p>house: <span id="text_house">0</span></p>
        <p>Stone: <span id="text_stone">0</span></p>
        <p>Barn: <span id="text_barn">0</span></p>

      </div>
    </div>
    <!-- Worker Container -->
    <div class="workercontainer">
      <div class="gridcontainers">
        <h1>basic</h1>
        <p>Work Hours: <span id="text_workhours_basic">0</span></p>
        <button class="button" onclick="find_timbermellow()">look for a Timbermellow</button><button class="button" onclick="timbermellow_5x()">5x Timbermellow</button>
        <button class="button" onclick="get_wood()">gather wood</button><button class="button" onclick="wood_5x()">5x wood</button>
        <button class="button" onclick="get_stone()">gather stone</button><button class="button" onclick="stone_5x()">5x stone</button>

       
      </div>

      <div class="gridcontainers">
        <h1>advanced</h1>
        <p>costs resources</p>
        <button class="button" onclick="make_human()">make human</button><button class="button" onclick="human_5x()">5x human</button>
        <button class="button" onclick="apont_soldier()">make soldier</button><button class="button" onclick="soldier_5x()">5x soldier</button>
        <button class="button" onclick="make_barn()">build barn</button>
        <button class="button" onclick="make_house()">build house</button>

      </div>
      
      
    </div>
  </div>
   

  <!-- Technology Container :) -->
  <div class="techcontainer" id="techcontainer">
    
    <div class="techgrid">
      <h2>Technologies</h2>
    <button class="button" id="stoneaxebt" style="display:none" onclick="stoneaxe()">Stone Axe</button>
    <button class="button" id="foodbasketbt" style="display:none" onclick="foodbasket()">Food Basket</button>
    </div>
  </div>
  <div class="gamelog">
    <div class="gamelogcontent">
        <h2>Game Log</h2>
        <div class="logheader">
           <p>Turn: <span id="time_name">1</span> season: <span id="log_season">spring</span></p>
            </div>
        <div id="logentries">

        </div>
    </div>

  </div>
  </div>
 <div class="turnendcontainer">
    <h2>turn:<span id="text_turn">1</span></h2>
    <span id="season">spring</span>  
    <button class="button" onclick="end_turn()">end turn</button>
    <p>timbermellow needed:<span id="text_endturn_timbermellow_current">0</span> / <span id="timbermellow_needed">0</span></p>
 </div>
  <script src="bottom_up.js"></script>
</body>
</html>
