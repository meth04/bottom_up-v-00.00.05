<!DOCTYPE html>
<!--
  playtest.html — an automated play-through of the core loop.

  Open it in a browser while the dev server is running:

      http://localhost:8080/scripts/playtest.html

  It loads the game in the frame below on a fixed world seed, waits for the
  living world (PixiJS) to come up, presses the real buttons in a sensible
  order (gather → barns → humans → soldier → explore → mapmaking → several
  turns) and prints PASS/FAIL lines underneath. Every check is something a player would notice if it broke.
  Add "#stop-after-explore" to the URL to leave the game sitting right after
  the first expedition, for a look at the map.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>bottom up — playtest</title>
<style>
  body { margin: 0; font-family: Consolas, monospace; background: #efe7d6; }
  iframe { width: 1440px; height: 900px; border: 0; display: block; }
  pre { margin: 0; padding: 12px 16px; font-size: 13px; white-space: pre-wrap; }
  .pass { color: #2f6b3a; } .fail { color: #b23a3a; font-weight: bold; }
</style>
</head>
<body>
<iframe id="game"></iframe>
<pre id="out">running…</pre>
<script>
const PLAYTEST_SEED = 424242;
const out = document.getElementById("out");
const lines = [];
function log(...parts) {
  lines.push(parts.join(" "));
  out.innerHTML = lines.map((line) => {
    if (line.startsWith("PASS")) return `<span class="pass">${line}</span>`;
    if (line.startsWith("FAIL")) return `<span class="fail">${line}</span>`;
    return line;
  }).join("\n");
}
function check(name, condition) { log((condition ? "PASS " : "FAIL ") + name); }
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

// A fresh game on a known seed: no save must be waiting in localStorage.
localStorage.removeItem("bottom_up.save.v1");
const frame = document.getElementById("game");
frame.src = `/?seed=${PLAYTEST_SEED}`;

frame.onload = async function () {
 try {
  const w = frame.contentWindow;
  // Top-level let/const in classic scripts aren't window properties, so
  // game.js's numbers have to be read inside the frame's own scope.
  const g = (expression) => w.eval(expression);
  const errors = [];
  w.onerror = (message) => errors.push(String(message));
  // The world is generated in a worker and the WebGL engine boots after it:
  // wait for the renderer rather than for a fixed time.
  for (let tries = 0; tries < 120 && !(w.renderer && w.hexMap); tries++) await wait(250);
  await wait(500);

  const land = (types) => w.territoryAvailable(types);
  const seasonText = () => w.document.getElementById("season").innerText;
  const status = (label) => log("--- turn", g("turngame"), seasonText(), label || "", "| humans", g("humans"), "soldiers", g("human_army"), "food", g("timbermellow_count"), "wood", g("wood"), "barns", g("barn"), "hours", g("working_hours"));

  log("--- start ---");
  // The interface starts at almost nothing and grows (js/ages.js).
  check("the game opens in Act I", g("agePhase") === "dawn");
  check("only the food button is showing", g('document.getElementById("btn_find_timbermellow").hidden') === false && g('document.getElementById("btn_wood").hidden') === true);
  check("the build tab is hidden at the start", w.document.querySelector('.rw-tab[data-tab="build"]').hidden === true);
  const map = g("hexMap");
  const villages = w.villagesGet();
  const startTile = map.getAllTiles().find((tile) => tile.isStartingTile);
  const wg = g("world");
  log("seed", g("worldSeed"), "| tiles", map.getAllTiles().length, "| continents", (wg.continents || []).length, "| rivers", wg.rivers.length, "| villages", villages.length);
  check("world generated on the requested seed", g("worldSeed") === PLAYTEST_SEED);
  check("the world is big (80,000+ hexes)", map.getAllTiles().length >= 80000);
  check("several continents", (wg.continents || []).length >= 3);
  check("at least one river", g("world").rivers.length >= 1);
  const terrains = new Set(map.getAllTiles().map((tile) => tile.terrainType));
  log("terrain kinds on this world:", [...terrains].sort().join(", "));
  check("there is open sea", terrains.has("ocean"));
  check("there are shallows along the coasts", terrains.has("shallows"));
  check("there are hills", terrains.has("hills"));
  check("the sea has a shore", terrains.has("beach"));
  check("there is cold ground in the north", terrains.has("tundra") || terrains.has("snowfield"));
  check("stretches of country have names", g("world").regions.length >= 20);
  check("no two places share a name", (() => {
    const names = g("world").regions.map((r) => r.name)
      .concat(g("world").rivers.map((r) => r.name).filter(Boolean))
      .concat(g("world").lakes.map((l) => l.name).filter(Boolean));
    return names.length === new Set(names).size;
  })());
  check("the rivers are named", g("world").rivers.filter((r) => r.name).length >= 3);
  check("the lakes are named", g("world").lakes.filter((l) => l.name).length >= 1);
  check("rivers carry a width", wg.tiles.some((t) => t.terrainType === "river" && t.riverWidth >= 2));
  check("the WebGL canvas is on the page", w.document.querySelector("#mapstage canvas") !== null);
  check("the renderer has every layer", ["terrain", "roads", "features", "units", "overlay", "labels", "weather"].every((name) => w.renderer.layers[name]));
  check("old roads join the villages", wg.tradeRoutes.length >= villages.length - (wg.continents || []).length - 2);
  check("the old tracks are real roads", map.roadTileCount > 50);
  check("the town has buildings on hexes", w.improvements.listFor("player").length >= 1);
  check("the village has a road network", w.roadNetwork.connectedToTown("player").size >= 1);
  check("no village was founded on water", villages.every((v) => !["ocean", "lake"].includes(map.getTile(v.homeTileId).terrainType)));
  check("several villages, one of them the garlock camp", villages.length >= 3 && villages.some((v) => v.kind === "garlock"));
  check("every village owns its home", villages.every((v) => map.ownerOf(v.homeTileId) === v.id));
  // A village is founded on a valley, not a hex (js/territory.js).
  log("founding valley:", w.territoryClaimedCount(), "hexes | food", land(["timbermellow"]), "wood", land(["wood"]), "stone", land(["stone"]));
  check("starts on a whole valley, not one hex", w.territoryClaimedCount() >= 30);
  check("the valley can feed a village", land(["timbermellow"]) >= 90);
  check("the valley has wood in it", land(["wood"]) >= 60);
  check("the valley has stone in it", land(["stone"]) >= 40);
  check("none of the valley is open water", w.hexMap.getClaimedTiles().every((t) => !["ocean", "lake"].includes(t.terrainType)));
  check("the neighbours were founded the same way",
    villages.filter((v) => v.kind !== "player").every((v) => map.getTilesOwnedBy(v.id).length >= 20));
  check("the start tile is the player's", map.isClaimed(startTile.id));

  // Turn 1: gather food all day.
  const foodOnLandAtStart = land(["timbermellow"]);
  for (let i = 0; i < 8; i++) w.find_timbermellow();
  log("after 8 gathers: food", g("timbermellow_count"), "| land food", land(["timbermellow"]), "| hours", g("working_hours"));
  check("gathering takes food off the land", land(["timbermellow"]) === foodOnLandAtStart - g("timbermellow_count") && g("timbermellow_count") >= 8);
  check("gather button greys out at 0 hours", w.document.getElementById("btn_find_timbermellow").disabled === true);

  // Explore should be refused, for a reason the player can read.
  // (Water can't be settled at all, so pick dry land to test the real reason.)
  const firstFrontier = map.getFrontierTiles().find((tile) => !["ocean", "lake"].includes(tile.terrainType)) || map.getFrontierTiles()[0];
  map.selectTile(firstFrontier.id);
  let blocker = w.territoryExploreBlocker(firstFrontier.id);
  log("explore blocker now:", blocker);
  check("explore refused (not enough humans)", /humans/.test(blocker));
  check("explore button disabled", w.document.getElementById("exploreButton").disabled === true);

  w.end_turn(); status("(ate 2)");
  check("the game autosaved at end of turn", localStorage.getItem("bottom_up.save.v1") !== null);
  check("the loading card got out of the way", w.document.getElementById("bootScreen").classList.contains("is-gone"));
  check("the turn ledger appeared", w.document.getElementById("turnReport") !== null);

  // Turn 2: wood for a barn, then food.
  for (let i = 0; i < 4; i++) w.get_wood();
  w.make_barn();
  for (let i = 0; i < 3; i++) w.find_timbermellow();
  check("built a second barn", g("barn") === 2);
  w.end_turn(); status();

  // Turn 3 (summer, 12 hours): another barn, more food.
  for (let i = 0; i < 4; i++) w.get_wood();
  w.make_barn();
  for (let i = 0; i < 7; i++) w.find_timbermellow();
  w.end_turn(); status();

  // Turn 4: raise two humans, fill the barns.
  w.make_human(); w.make_human();
  check("raised humans to 4", g("humans") === 4);
  w.timbermellow_5x(); w.timbermellow_5x();
  w.end_turn(); status("(4 mouths to feed)");
  check("nobody starved", g("humans") === 4);
  check("autumn gives work hours (was a bug)", g("working_hours") > 0);

  // Turn 5 (autumn, double gathering): train a soldier, stock up, explore next door.
  w.apont_soldier();
  w.timbermellow_5x();
  status("(ready to explore?)");
  const frontier = map.getFrontierTiles().filter((tile) => !["ocean", "lake"].includes(tile.terrainType));
  const target = frontier.find((tile) => tile.resources.stone) || frontier[0];
  const targetResources = Object.assign({}, ...Object.keys(target.resources).map((type) => ({ [type]: target.resources[type].amount })));
  map.selectTile(target.id);
  blocker = w.territoryExploreBlocker(target.id);
  log("exploring", target.id, target.terrainType, JSON.stringify(targetResources), "| blocker:", blocker === null ? "(none)" : blocker);
  check("explore allowed", blocker === null);
  const tilesBefore = w.territoryClaimedCount();
  const foodBefore = g("timbermellow_count");
  const landBefore = land(["timbermellow", "wood", "stone", "grain"]);
  const expected = w.territoryExploreYield(target.id);
  w.explore();
  log("after explore: tiles", w.territoryClaimedCount(), "(expected +" + expected + ")", "food", g("timbermellow_count"));
  // The grid is fine now, so an expedition settles a district, not one field.
  check("explore claimed a whole district", w.territoryClaimedCount() === tilesBefore + expected && expected >= 7);
  check("explore cost 10 food", g("timbermellow_count") === foodBefore - 10);
  check("the district's resources joined the land", land(["timbermellow", "wood", "stone", "grain"]) > landBefore);
  await wait(1400);
  check("new tile is claimed", map.isClaimed(target.id));
  check("a new frontier appeared beyond it", map.getFrontierTiles().length > 6);
  check("clicking works by hex maths, not by one element per hex",
    w.tileAtWorld(w.worldTileCenter(target.q, target.r, g("mapGrid")).x,
                  w.worldTileCenter(target.q, target.r, g("mapGrid")).y).id === target.id);
  check("things are moving on the map", w.renderer && (w.renderer.sim ? w.renderer.sim.counts.total > 0 : true));

  if (location.hash === "#stop-after-explore") {
    log("--- stopped after explore (#stop-after-explore) ---");
    document.title = "PLAYTEST STOPPED";
    return;
  }

  // Stone comes off the land too.
  if (land(["stone"]) > 0) {
    const before = land(["stone"]);
    w.get_stone();
    check("gathering stone takes it off the land", land(["stone"]) === before - 1 && g("stone") === 1);
  }

  // Hidden tiles stay hidden until mapmaking.
  const farTile = map.getAllTiles().reduce((best, tile) => (w.hexDistance(tile, startTile) > w.hexDistance(best, startTile) ? tile : best), startTile);
  check("far tile is hidden", map.isRevealed(farTile.id) === false);
  w.territoryRevealMap();
  check("mapmaking reveals far tile", map.isRevealed(farTile.id) === true);

  // Several idle turns: the neighbours expand, the seasons turn.
  const foreignBefore = map.getAllTiles().filter((tile) => tile.owner && tile.owner !== "player").length;
  for (let i = 0; i < 8; i++) w.end_turn();
  status("(idle)");
  const foreignAfter = map.getAllTiles().filter((tile) => tile.owner && tile.owner !== "player").length;
  log("other villages' tiles:", foreignBefore, "->", foreignAfter);
  check("other villages expand over time", foreignAfter > foreignBefore);
  check("autumn regrowth refilled the home valley", land(["timbermellow"]) >= 90);
  check("the save is small enough for a browser to hold",
    localStorage.getItem("bottom_up.save.v1").length < 2 * 1024 * 1024);
  check("season class updates", w.document.getElementById("season").className.indexOf("season--") >= 0);

  // The acts, the trades and the standing orders.
  check("gathering unlocked the wood button", g('document.getElementById("btn_wood").hidden') === false);
  check("the build tab opened once there was wood", w.document.querySelector('.rw-tab[data-tab="build"]').hidden === false);
  log("act now:", g("agePhase"), "| unlocked:", Object.keys(g("ageUnlocked")).join(","));
  check("the village has moved past Act I", g("agePhase") !== "dawn");
  check("Act II opened research", w.document.querySelector('.rw-tab[data-tab="research"]').hidden === false);

  // Build a school and put somebody through it.
  g("wood = Math.max(wood, 40); stone = Math.max(stone, 40); working_hours = 30; timbermellow_count = Math.max(timbermellow_count, 30); humans = Math.max(humans, 5); update()");
  w.make_school();
  check("a school can be built", g("school") === 1);
  const humansBeforeTraining = g("humans");
  w.professionTrain("farmer");
  check("training takes the villager off the rota", g("humans") === humansBeforeTraining - 1);
  check("the trainee still eats", g("professionTraineeCount()") === 1);
  // Two turns of training. Nobody may freeze or starve meanwhile, so the
  // village is given roofs and food for the duration.
  g("stonehouse = 10; peoplecap = 30; timbermellow_count = 60; storage_capacity = 200; barn = 40; update()");
  w.end_turn(); w.end_turn();
  check("the trainee came back a farmer", g("professionCounts.farmer") === 1 && g("humans") === humansBeforeTraining);

  // Spending a whole day in one press, and a turn that asks before it hurts.
  // (Not in winter — nothing can be gathered then, by design.)
  g("seasonchecker = 1; document.getElementById('season').innerText = 'spring'; working_hours = 12; timbermellow_count = 0; barn = 20; storage_capacity = 100; update()");
  const hoursBefore = g("working_hours");
  w.timbermellow_all();
  log("ALL: hours", hoursBefore, "->", g("working_hours"), "| food", g("timbermellow_count"));
  check("ALL spends the day in one press", g("working_hours") < hoursBefore - 1 && g("timbermellow_count") > 0);

  g("timbermellow_count = 0; update()");
  check("a starving turn warns before it happens", w.endTurnWarnings().some((t) => /unfed/.test(t)));
  g("timbermellow_count = 80; update()");
  check("a safe turn asks nothing", w.endTurnWarnings().length === 0);

  // The village is populated, and the people in it have trades.
  g("humans = 10; human_army = 2; professionCounts.forester = 2; professionCounts.farmer = 2; update()");
  await wait(200);
  // The simulation (js/world/agents.js) is what walks the map now.
  const sim = w.renderer.sim;
  const home = w.villageCenter();
  w.renderer.camera.focusOn(home.x, home.y, 1.5, { animate: false });
  for (let i = 0; i < 30; i++) sim.update(1 / 30, w.renderer.camera.getBounds(400));
  const folk = sim.getRenderList(w.renderer.camera.getBounds(400)).filter((a) => a.kind === "villager");
  log("figures on the map:", folk.length, "| trades:", JSON.stringify(folk.reduce((n, a) => (n[a.variant] = (n[a.variant] || 0) + 1, n), {})));
  check("the village fills with figures", folk.length >= 8);
  check("trained villagers carry the right tools",
    folk.some((a) => a.variant === "forester") && folk.some((a) => a.variant === "farmer"));
  check("soldiers patrol", sim.getRenderList(w.renderer.camera.getBounds(400)).some((a) => a.kind === "soldier"));
  check("carts and wildlife are about", sim.counts.total > folk.length + 2);
  check("the town has work sites on the land", w.improvements.listFor("player").some((e) => e.kind === "site"));
  check("every work site is on the road network",
    w.improvements.listFor("player").filter((e) => e.kind === "site").every((e) => w.roadNetwork.isConnected(e.tileId, "player")));
  check("roads make the land yield more", w.territoryRoadMultiplier() > 1);
  check("the trade caravans arrive", Array.isArray(w.territoryTradeTurn()));

  // The ledger: the empire-game screen.
  w.uiSetTab("empire");
  g("update()");
  await wait(120);
  const ledger = w.document.querySelector('.rw-pane[data-pane="empire"]');
  check("the Ledger tab opens", ledger !== null && ledger.hidden === false);
  check("it counts the people", w.document.getElementById("empirePeople").children.length > 3);
  check("it works out what a turn brings in and eats", w.document.getElementById("empireProduction").children.length > 5);
  check("it breaks the land down by terrain", w.document.getElementById("empireLand").children.length > 3);
  check("it lists every settlement on the island",
    w.document.getElementById("empireRivals").children.length >= 10);
  check("it shows the whole tech tree, locked ones included",
    w.document.getElementById("empireTechs").children.length === 4);
  check("the age bar shows progress toward the next act",
    w.document.getElementById("ageProgressFill").style.width !== "");
  uiSetTabBack();
  function uiSetTabBack() { w.uiSetTab("gather"); }

  const logText = w.document.getElementById("logentries").textContent;
  check("log mentions garlocks, not orcs", !/\borc/i.test(logText));
  check("log has turn headings", w.document.querySelector(".logentry--turn") !== null);
  check("villages panel lists the villages", w.document.querySelectorAll("#villageList .villagerow").length === villages.length);

  // Save/load round trip: the state that goes into the save must come back out.
  const saved = JSON.parse(localStorage.getItem("bottom_up.save.v1"));
  check("save remembers the seed and the turn", saved.seed === PLAYTEST_SEED && saved.game.turngame === g("turngame"));
  check("save remembers who owns the explored tile", saved.map.tiles[target.id].o === "player");
  check("save remembers the roads", Object.values(saved.map.tiles).some((entry) => entry.r));

  log("--- errors:", errors.length ? errors.join(" | ") : "none");
  check("no JS errors", errors.length === 0);
  const failed = lines.filter((line) => line.startsWith("FAIL")).length;
  log(failed ? `=== ${failed} FAILED ===` : "=== ALL PASSED ===");
  document.title = "PLAYTEST DONE";
 } catch (error) {
  log("HARNESS EXCEPTION:", error && error.message, "\n", error && error.stack);
 }
};
</script>
</body>
</html>
